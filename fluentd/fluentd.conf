<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<source>
  @type tail
  path /var/log/containers/*.log
  pos_file /tmp/fluentd-containers.log.pos
  tag docker.*
  read_from_head true
  <parse>
    @type json
  </parse>
</source>

<match **>
  @type elasticsearch
  host 172.20.20.12
  port 9200
  logstash_format true
  logstash_prefix zabbix-logs
  flush_interval 5s
</match>
