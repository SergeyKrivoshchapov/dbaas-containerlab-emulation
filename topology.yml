name: pg-lab

topology:
  nodes:
    router:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - ./frr/daemons:/etc/frr/daemons
        - ./frr/frr.conf:/etc/frr/frr.conf
      exec:
        - ip addr add 172.20.21.254/24 dev eth1
        - ip addr add 172.20.21.254/24 dev eth2
        - ip addr add 172.20.22.254/24 dev eth3
        - ip addr add 172.20.22.254/24 dev eth4
        - ip addr add 172.20.23.254/24 dev eth5
        - ip addr add 172.20.23.254/24 dev eth6
        - ip addr add 172.20.23.254/24 dev eth7
        - ip addr add 172.20.24.254/24 dev eth8
        - ip addr add 172.20.24.254/24 dev eth9
        - ip addr add 172.20.24.254/24 dev eth10
        - ip addr add 172.20.24.254/24 dev eth11
        - ip addr add 172.20.24.254/24 dev eth12
        - ip addr add 172.20.24.254/24 dev eth13
        - ip addr add 172.20.24.254/24 dev eth14
        - ip addr add 172.20.24.254/24 dev eth15
        - ip addr add 172.20.24.254/24 dev eth16
        - sysctl -w net.ipv4.ip_forward=1
      cmd: /usr/lib/frr/docker-start

    etcd1:
      kind: linux
      image: ubuntu:22.04
      cmd: sleep infinity

    etcd2:
      kind: linux
      image: ubuntu:22.04
      cmd: sleep infinity

    etcd3:
      kind: linux
      image: ubuntu:22.04
      cmd: sleep infinity

    node1:
      kind: linux
      image: postgres-patrony:15
      binds:
        - ./patroni_cfg/patroni-node1.yml:/etc/patroni.yml
        - ./patroni_cfg/run_patroni.sh:/usr/local/bin/run_patroni.sh
        - ./zabbix-agent/zabbix_agent2.conf:/etc/zabbix/zabbix_agent2.conf
      exec:
        - ip addr add 172.20.21.11/24 dev eth1
      cmd: sleep infinity

    node2:
      kind: linux
      image: postgres-patrony:15
      binds:
        - ./patroni_cfg/patroni-node2.yml:/etc/patroni.yml
        - ./patroni_cfg/run_patroni.sh:/usr/local/bin/run_patroni.sh
      exec:
        - ip addr add 172.20.21.12/24 dev eth1
      cmd: sleep infinity

    haproxy1:
      kind: linux
      image: haproxy:latest
      binds:
        - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
      ports:
        - 5432:5432
        - 5433:5433
        - 8404:8404
      cmd: sleep infinity

    haproxy2:
      kind: linux
      image: haproxy:latest
      binds:
        - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
      cmd: sleep infinity

    prometheus:
      kind: linux
      image: mirror.gcr.io/prom/prometheus:latest
      binds:
        - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      exec:
        - ip addr add 172.20.24.10/24 dev eth1
      ports:
        - 9090:9090
      cmd: --config.file=/etc/prometheus/prometheus.yml --web.listen-address=:9090

    grafana:
      kind: linux
      image: mirror.gcr.io/grafana/grafana:latest
      exec:
        - ip addr add 172.20.24.11/24 dev eth1
      ports:
        - 3000:3000
      cmd: /run.sh

    zabbix-server:
      kind: linux
      image: zabbix/zabbix-server-pgsql:alpine-6.4-latest
      exec:
        - ip addr add 172.20.24.20/24 dev eth1
      env:
        POSTGRES_USER: zabbix
        POSTGRES_PASSWORD: zabbix
        POSTGRES_DB: zabbix
        DB_SERVER_HOST: zabbix-db
      ports:
        - 10051:10051
      cmd: /usr/sbin/zabbix_server --foreground

    zabbix-db:
      kind: linux
      image: postgres:15-alpine
      exec:
        - ip addr add 172.20.24.21/24 dev eth1
      env:
        POSTGRES_USER: zabbix
        POSTGRES_PASSWORD: zabbix
        POSTGRES_DB: zabbix
      cmd: docker-entrypoint.sh postgres

    zabbix-web:
      kind: linux
      image: zabbix/zabbix-web-nginx-pgsql:alpine-6.4-latest
      exec:
        - ip addr add 172.20.24.22/24 dev eth1
      env:
        DB_SERVER_HOST: "172.20.24.21"
        DB_SERVER_PORT: "5432"
        POSTGRES_USER: "zabbix"
        POSTGRES_PASSWORD: "zabbix"
        POSTGRES_DB: "zabbix"
        ZBX_SERVER_HOST: "172.20.24.20"
        ZBX_SERVER_PORT: "10051"
      ports:
        - 8080:8080

    elasticsearch:
      kind: linux
      image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
      exec:
        - ip addr add 172.20.24.30/24 dev eth1
      env:
        discovery.type: single-node
        xpack.security.enabled: false
      ports:
        - 9200:9200
      cmd: /bin/tini -- /usr/local/bin/docker-entrypoint.sh

    kibana:
      kind: linux
      image: docker.elastic.co/kibana/kibana:8.11.0
      exec:
        - ip addr add 172.20.24.31/24 dev eth1
      env:
        ELASTICSEARCH_HOSTS: http://172.20.24.30:9200
      ports:
        - 5601:5601

    fluentd:
      kind: linux
      image: mirror.gcr.io/fluent/fluentd:latest
      exec:
        - ip addr add 172.20.24.32/24 dev eth1
      binds:
        - ./fluentd/fluentd.conf:/fluentd/etc/fluentd.conf
      ports:
        - 24224:24224
      cmd: fluentd -c /fluentd/etc/fluentd.conf

    jaeger:
      kind: linux
      image: mirror.gcr.io/jaegertracing/all-in-one:1.49
      exec:
        - ip addr add 172.20.24.40/24 dev eth1
      env:
        COLLECTOR_OTLP_ENABLED: true
      ports:
        - 16686:16686
        - 4317:4317
        - 4318:4318

  links:
    - endpoints: ["node1:eth1", "router:eth1"]
    - endpoints: ["node2:eth1", "router:eth2"]
    - endpoints: ["haproxy1:eth1", "router:eth3"]
    - endpoints: ["haproxy2:eth1", "router:eth4"]
    - endpoints: ["etcd1:eth1", "router:eth5"]
    - endpoints: ["etcd2:eth1", "router:eth6"]
    - endpoints: ["etcd3:eth1", "router:eth7"]
    - endpoints: ["haproxy1:eth2", "haproxy2:eth2"]
    - endpoints: ["prometheus:eth1", "router:eth8"]
    - endpoints: ["grafana:eth1", "router:eth9"]
    - endpoints: ["zabbix-server:eth1", "router:eth10"]
    - endpoints: ["zabbix-db:eth1", "router:eth11"]
    - endpoints: ["zabbix-web:eth1", "router:eth12"]
    - endpoints: ["elasticsearch:eth1", "router:eth13"]
    - endpoints: ["kibana:eth1", "router:eth14"]
    - endpoints: ["fluentd:eth1", "router:eth15"]
    - endpoints: ["jaeger:eth1", "router:eth16"]
